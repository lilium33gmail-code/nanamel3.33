<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nanamel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Quicksand:wght@500;700&family=Vazirmatn:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #121011;
            --bg-card: #1e1a1d;
            --bg-nav: #171416;
            --text-main: #f5f0f2;
            --text-muted: #a89ba3;
            --accent: #d4a373;
            --accent-dark: #b08557;
            --border-color: rgba(212, 163, 115, 0.2);
            --shadow: 0 4px 15px rgba(0,0,0,0.4);
            --radius: 16px;
            --safe-padding: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Quicksand', sans-serif; -webkit-tap-highlight-color: transparent; }
        body[dir="rtl"] { font-family: 'Vazirmatn', sans-serif; }
        body[dir="rtl"] .nav-btn, body[dir="rtl"] .title-placeholder { font-family: 'Vazirmatn', sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); padding-bottom: 80px; overflow-x: hidden; width: 100%; min-height: 100vh; }
        header { position: sticky; top: 0; width: 100%; height: 70px; background: rgba(18, 16, 17, 0.95); backdrop-filter: blur(10px); display: flex; justify-content: space-between; align-items: center; padding: 0 16px; z-index: 1000; border-bottom: 1px solid var(--border-color); }
        header h1 { font-family: 'Playfair Display', serif; font-style: italic; font-size: 32px; color: var(--accent); font-weight: 600; }
        body[dir="rtl"] header h1 { font-family: 'Vazirmatn', sans-serif; font-style: normal; }
        .lang-btn, .admin-btn { background: transparent; border: 1px solid var(--accent); color: var(--accent); padding: 6px 12px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 13px; margin-left: 6px; }
        .lang-btn:hover, .admin-btn:hover { background: var(--accent); color: var(--bg-main); }
        .admin-btn.active { background: var(--accent); color: var(--bg-main); }
        .nav-container { display: flex; overflow-x: auto; white-space: nowrap; padding: 16px var(--safe-padding); gap: 10px; background: var(--bg-nav); border-bottom: 1px solid var(--border-color); scrollbar-width: none; }
        .nav-container::-webkit-scrollbar { display: none; }
        .nav-btn { padding: 10px 18px; background: transparent; border: 1px solid var(--border-color); border-radius: 30px; font-size: 13px; font-weight: 700; color: var(--text-muted); cursor: pointer; flex-shrink: 0; }
        .nav-btn.active { background: var(--accent); color: var(--bg-main); border-color: var(--accent); }
        .nav-btn.locked { border-color: rgba(255, 255, 255, 0.1); color: #666; }
        main { padding: var(--safe-padding); width: 100%; }
        .page { display: none; animation: fadeIn 0.4s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .page-title { font-family: 'Playfair Display', serif; font-size: 22px; text-align: center; margin-bottom: 16px; color: var(--accent); }
        body[dir="rtl"] .page-title { font-family: 'Vazirmatn', sans-serif; }
        .add-area { display: none; background: var(--bg-card); border: 2px dashed var(--accent); border-radius: var(--radius); padding: 16px; margin-bottom: 20px; text-align: center; }
        .add-area.show { display: block; }
        .add-area input { width: 100%; padding: 10px; margin: 6px 0; border-radius: 10px; border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-main); font-size: 14px; outline: none; }
        .add-btn { background: var(--accent); color: var(--bg-main); border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; margin-top: 8px; width: 100%; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .item { background: var(--bg-card); border-radius: var(--radius); padding: 8px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; position: relative; }
        .media-placeholder { width: 100%; aspect-ratio: 1 / 1; background: #0a090a; border-radius: 12px; overflow: hidden; display: flex; justify-content: center; align-items: center; position: relative; }
        .media-placeholder img, .media-placeholder video { width: 100%; height: 100%; object-fit: cover; display: block; }
        .media-placeholder iframe { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; }
        .title-placeholder { text-align: center; font-size: 12px; font-weight: 700; padding: 6px; background: rgba(0,0,0,0.2); border-radius: 8px; color: var(--text-muted); outline: none; }
        .delete-btn { position: absolute; top: 12px; right: 12px; background: rgba(255, 50, 50, 0.85); color: white; border: none; width: 28px; height: 28px; border-radius: 50%; font-size: 16px; cursor: pointer; display: none; z-index: 10; }
        .admin-mode .delete-btn { display: block; }
        .lock-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg-card); border-radius: var(--radius); box-shadow: var(--shadow); text-align: center; padding: 40px 20px; margin-top: 20px; border: 1px solid var(--border-color); }
        .lock-screen h2 { font-family: 'Playfair Display', serif; color: var(--accent); font-size: 20px; margin-bottom: 16px; }
        body[dir="rtl"] .lock-screen h2 { font-family: 'Vazirmatn', sans-serif; }
        .lock-input { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-main); font-size: 16px; text-align: center; margin-bottom: 12px; outline: none; }
        .lock-btn { padding: 12px 24px; background: var(--accent); color: var(--bg-main); border: none; border-radius: 20px; font-weight: bold; width: 100%; cursor: pointer; }
        .lock-error { color: #ff4d4d; font-size: 12px; margin-top: 8px; display: none; }
        .empty-state { text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: 15px; grid-column: 1 / -1; }
        .music-area { display: none; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 12px; margin-bottom: 16px; text-align: center; }
        .music-area.show { display: block; }
        .music-area input { width: 100%; padding: 10px; margin: 6px 0; border-radius: 10px; border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-main); font-size: 14px; outline: none; }
        .music-status { color: var(--text-muted); font-size: 12px; text-align: center; margin-top: 8px; }
        .music-player { width: 100%; margin-top: 8px; accent-color: var(--accent); }
        @media (max-width: 320px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header>
        <button class="admin-btn" id="adminBtn" onclick="toggleAdmin()">Admin</button>
        <h1 id="siteLogo">Nanamel</h1>
        <button class="lang-btn" id="langBtn" onclick="toggleLanguage()">FA</button>
    </header>

    <div class="nav-container" id="navMenu">
        <button class="nav-btn active" onclick="showPage('didForHer', this)" data-en="Things I did for her" data-fa="کارهایی که براش کردم">Things I did for her</button>
        <button class="nav-btn" onclick="showPage('sheDidForMe', this)" data-en="Things she did for me" data-fa="کارهایی که برام کرد">Things she did for me</button>
        <button class="nav-btn" onclick="showPage('together', this)" data-en="Things we do together" data-fa="کارهایی که با هم کردیم">Things we do together</button>
        <button class="nav-btn" onclick="showPage('weLove', this)" data-en="Things we love" data-fa="چیزایی که دوسش داریم">Things we love</button>
        <button class="nav-btn" onclick="showPage('weWill', this)" data-en="Things we will do" data-fa="کارهایی که قراره بکنیم">Things we will do</button>
        <button class="nav-btn locked" onclick="showPage('shouldnt', this)" data-en="Things we shouldn't do 🔒" data-fa="کارهایی که شاید نباید می‌کردیم 🔒">Things we shouldn't do 🔒</button>
    </div>

    <main>
        <section id="page-didForHer" class="page active">
            <h2 class="page-title" data-en="Things I did for her" data-fa="کارهایی که براش کردم">Things I did for her</h2>
            <div class="music-area" id="music-didForHer">
                <input type="text" id="music-url-didForHer" placeholder="MP3 filename, e.g. love.mp3">
                <button class="add-btn" onclick="saveMusic('didForHer')">Save music for this page</button>
                <p class="music-status" id="music-status-didForHer" aria-live="polite">No song saved yet</p>
            </div>
            <div class="add-area" id="add-didForHer">
                <input type="text" id="url-didForHer" placeholder="لینک (عکس، فیلم یا embed)">
                <input type="text" id="title-didForHer" placeholder="عنوان (اختیاری)">
                <button class="add-btn" onclick="addItem('didForHer')">افزودن</button>
            </div>
            <div class="grid" id="grid-didForHer"></div>
        </section>

        <section id="page-sheDidForMe" class="page">
            <h2 class="page-title" data-en="Things she did for me" data-fa="کارهایی که برام کرد">Things she did for me</h2>
            <div class="music-area" id="music-sheDidForMe">
                <input type="text" id="music-url-sheDidForMe" placeholder="MP3 filename, e.g. love.mp3">
                <button class="add-btn" onclick="saveMusic('sheDidForMe')">Save music for this page</button>
                <p class="music-status" id="music-status-sheDidForMe" aria-live="polite">No song saved yet</p>
            </div>
            <div class="add-area" id="add-sheDidForMe">
                <input type="text" id="url-sheDidForMe" placeholder="لینک (عکس، فیلم یا embed)">
                <input type="text" id="title-sheDidForMe" placeholder="عنوان (اختیاری)">
                <button class="add-btn" onclick="addItem('sheDidForMe')">افزودن</button>
            </div>
            <div class="grid" id="grid-sheDidForMe"></div>
        </section>

        <section id="page-together" class="page">
            <h2 class="page-title" data-en="Things we do together" data-fa="کارهایی که با هم کردیم">Things we do together</h2>
            <div class="music-area" id="music-together">
                <input type="text" id="music-url-together" placeholder="MP3 filename, e.g. love.mp3">
                <button class="add-btn" onclick="saveMusic('together')">Save music for this page</button>
                <p class="music-status" id="music-status-together" aria-live="polite">No song saved yet</p>
            </div>
            <div class="add-area" id="add-together">
                <input type="text" id="url-together" placeholder="لینک (عکس، فیلم یا embed)">
                <input type="text" id="title-together" placeholder="عنوان (اختیاری)">
                <button class="add-btn" onclick="addItem('together')">افزودن</button>
            </div>
            <div class="grid" id="grid-together"></div>
        </section>

        <section id="page-weLove" class="page">
            <h2 class="page-title" data-en="Things we love" data-fa="چیزایی که دوسش داریم">Things we love</h2>
            <div class="music-area" id="music-weLove">
                <input type="text" id="music-url-weLove" placeholder="MP3 filename, e.g. love.mp3">
                <button class="add-btn" onclick="saveMusic('weLove')">Save music for this page</button>
                <p class="music-status" id="music-status-weLove" aria-live="polite">No song saved yet</p>
            </div>
            <div class="add-area" id="add-weLove">
                <input type="text" id="url-weLove" placeholder="لینک (عکس، فیلم یا embed)">
                <input type="text" id="title-weLove" placeholder="عنوان (اختیاری)">
                <button class="add-btn" onclick="addItem('weLove')">افزودن</button>
            </div>
            <div class="grid" id="grid-weLove"></div>
        </section>

        <section id="page-weWill" class="page">
            <h2 class="page-title" data-en="Things we will do" data-fa="کارهایی که قراره بکنیم">Things we will do</h2>
            <div class="music-area" id="music-weWill">
                <input type="text" id="music-url-weWill" placeholder="MP3 filename, e.g. love.mp3">
                <button class="add-btn" onclick="saveMusic('weWill')">Save music for this page</button>
                <p class="music-status" id="music-status-weWill" aria-live="polite">No song saved yet</p>
            </div>
            <div class="add-area" id="add-weWill">
                <input type="text" id="url-weWill" placeholder="لینک (عکس، فیلم یا embed)">
                <input type="text" id="title-weWill" placeholder="عنوان (اختیاری)">
                <button class="add-btn" onclick="addItem('weWill')">افزودن</button>
            </div>
            <div class="grid" id="grid-weWill"></div>
        </section>

        <section id="page-shouldnt" class="page">
            <h2 class="page-title" data-en="Things we shouldn't do 🔒" data-fa="کارهایی که شاید نباید می‌کردیم 🔒">Things we shouldn't do 🔒</h2>
            <div class="music-area" id="music-shouldnt">
                <input type="text" id="music-url-shouldnt" placeholder="MP3 filename, e.g. love.mp3">
                <button class="add-btn" onclick="saveMusic('shouldnt')">Save music for this page</button>
                <p class="music-status" id="music-status-shouldnt" aria-live="polite">No song saved yet</p>
            </div>
            <div id="content-shouldnt" style="display: none;">
                <div class="add-area" id="add-shouldnt">
                    <input type="text" id="url-shouldnt" placeholder="لینک (عکس، فیلم یا embed)">
                    <input type="text" id="title-shouldnt" placeholder="عنوان (اختیاری)">
                    <button class="add-btn" onclick="addItem('shouldnt')">افزودن</button>
                </div>
                <div class="grid" id="grid-shouldnt"></div>
            </div>
            <div class="lock-screen" id="lock-shouldnt">
                <h2 data-en="Enter Password" data-fa="رمز رو بزن">Enter Password</h2>
                <input type="password" id="pass-shouldnt" class="lock-input" placeholder="Password">
                <button class="lock-btn" onclick="checkPassword()" data-en="Unlock" data-fa="باز کن">Unlock</button>
                <p class="lock-error" id="error-shouldnt" data-en="Wrong password!" data-fa="رمز اشتباهه!">Wrong password!</p>
            </div>
        </section>
    </main>

    <audio id="pageAudio" loop preload="none"></audio>

    <script>
        // Passwords
        const ADMIN_PASS = "nanamel11";
        const SECRET_PASS_SHOULDNT = "nononono";

        let currentLang = 'en';
        let isAdmin = false;
        let unlockedShouldnt = false;

        const categories = ['didForHer', 'sheDidForMe', 'together', 'weLove', 'weWill', 'shouldnt'];
        const pageAudio = document.getElementById('pageAudio');
        let currentMusicPage = null;

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'fa' : 'en';
            const langBtn = document.getElementById('langBtn');
            const body = document.body;

            if (currentLang === 'fa') {
                body.setAttribute('dir', 'rtl');
                langBtn.textContent = 'EN';
                document.getElementById('siteLogo').textContent = 'نانامل';
            } else {
                body.setAttribute('dir', 'ltr');
                langBtn.textContent = 'FA';
                document.getElementById('siteLogo').textContent = 'Nanamel';
            }

            document.querySelectorAll('[data-en]').forEach(el => {
                el.textContent = el.getAttribute('data-' + currentLang);
            });

            const passInput = document.getElementById('pass-shouldnt');
            if (passInput) passInput.placeholder = currentLang === 'fa' ? 'رمز' : 'Password';

            document.querySelectorAll('.music-area').forEach(area => {
                const category = area.id.replace('music-', '');
                const input = document.getElementById('music-url-' + category);
                const button = area.querySelector('.add-btn');
                if (input) input.placeholder = currentLang === 'fa' ? 'نام فایل MP3 (مثلاً love.mp3)' : 'MP3 filename, e.g. love.mp3';
                if (button) button.textContent = currentLang === 'fa' ? 'ذخیره آهنگ این صفحه' : 'Save music for this page';
            });

            renderAll();
            refreshMusicStatuses();
        }

        function toggleAdmin() {
            if (isAdmin) {
                isAdmin = false;
                document.body.classList.remove('admin-mode');
                document.getElementById('adminBtn').classList.remove('active');
                document.getElementById('adminBtn').textContent = 'Admin';
                document.querySelectorAll('.add-area, .music-area').forEach(el => el.classList.remove('show'));
                return;
            }

            const pass = prompt(currentLang === 'fa' ? 'رمز ادمین را وارد کنید:' : 'Enter admin password:');
            if (pass === ADMIN_PASS) {
                isAdmin = true;
                document.body.classList.add('admin-mode');
                document.getElementById('adminBtn').classList.add('active');
                document.getElementById('adminBtn').textContent = 'Admin ✓';
                document.querySelectorAll('.add-area, .music-area').forEach(el => el.classList.add('show'));
                refreshMusicStatuses();
            } else if (pass !== null) {
                alert(currentLang === 'fa' ? 'رمز اشتباه است!' : 'Wrong password!');
            }
        }

        function showPage(pageName, btn) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('page-' + pageName).classList.add('active');
            btn.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // The locked section only plays after its password is entered.
            if (pageName === 'shouldnt' && !unlockedShouldnt) {
                stopPageMusic();
                return;
            }
            playPageMusic(pageName);
        }

        function checkPassword() {
            const input = document.getElementById('pass-shouldnt').value;
            const lockScreen = document.getElementById('lock-shouldnt');
            const content = document.getElementById('content-shouldnt');
            const error = document.getElementById('error-shouldnt');

            if (input === SECRET_PASS_SHOULDNT) {
                unlockedShouldnt = true;
                lockScreen.style.display = 'none';
                content.style.display = 'block';
                error.style.display = 'none';
                playPageMusic('shouldnt');
            } else {
                error.style.display = 'block';
            }
        }

        function getData() {
            try {
                const raw = localStorage.getItem('nanamel_gallery');
                return raw ? JSON.parse(raw) : {
                    didForHer: [], sheDidForMe: [], together: [],
                    weLove: [], weWill: [], shouldnt: []
                };
            } catch {
                return {
                    didForHer: [], sheDidForMe: [], together: [],
                    weLove: [], weWill: [], shouldnt: []
                };
            }
        }

        function saveData(data) {
            localStorage.setItem('nanamel_gallery', JSON.stringify(data));
        }

        // Default soundtrack: keep these filenames exactly as provided.
        // Place all five MP3 files in the same folder as this HTML file.
        const defaultPageMusic = {
            didForHer: 'we fell in love in october girl in red.mp3',
            sheDidForMe: 'watch you sleep.mp3',
            together: 'Kina _ Get You The Moon.mp3',
            weLove: 'Those eyes.mp3',
            weWill: 'Salvatore.mp3'
        };

        function getMusicData() {
            let saved = {};
            try {
                saved = JSON.parse(localStorage.getItem('nanamel_music')) || {};
            } catch {
                saved = {};
            }

            // Apply the default soundtrack once, while preserving later changes made in Admin.
            if (localStorage.getItem('nanamel_music_defaults_v1') !== 'done') {
                saved = { ...saved, ...defaultPageMusic };
                localStorage.setItem('nanamel_music', JSON.stringify(saved));
                localStorage.setItem('nanamel_music_defaults_v1', 'done');
            }

            return { ...defaultPageMusic, ...saved };
        }

        // Accepts a local MP3 filename/path, not just an internet URL.
        function saveMusic(category) {
            const input = document.getElementById('music-url-' + category);
            const path = input.value.trim();

            if (!path) {
                alert(currentLang === 'fa' ? 'نام فایل آهنگ را وارد کن' : 'Please enter an MP3 filename');
                return;
            }

            // Keep local relative paths such as "love.mp3" or "music/love.mp3".
            // Full http/https URLs are also accepted for compatibility with existing saved links.
            if (/^(javascript|data|file):/i.test(path)) {
                alert(currentLang === 'fa' ? 'نام فایل یا مسیر نسبی MP3 را وارد کن؛ از این نوع آدرس استفاده نکن' : 'Enter an MP3 filename or relative path; this URL type is not allowed.');
                return;
            }

            const music = getMusicData();
            music[category] = path;
            localStorage.setItem('nanamel_music', JSON.stringify(music));
            refreshMusicStatuses();

            const activePage = document.querySelector('.page.active');
            if (activePage && activePage.id === 'page-' + category &&
                (category !== 'shouldnt' || unlockedShouldnt)) {
                playPageMusic(category);
            }
        }

        function refreshMusicStatuses() {
            const music = getMusicData();
            categories.forEach(category => {
                const input = document.getElementById('music-url-' + category);
                const status = document.getElementById('music-status-' + category);
                if (!input || !status) return;
                if (music[category] && !input.value) input.value = music[category];
                status.textContent = music[category]
                    ? (currentLang === 'fa' ? 'آهنگ این صفحه ذخیره شده: ' + music[category] : 'Music saved: ' + music[category])
                    : (currentLang === 'fa' ? 'هنوز آهنگی انتخاب نشده' : 'No song saved yet');
            });
        }

        function stopPageMusic() {
            pageAudio.pause();
            pageAudio.currentTime = 0;
            pageAudio.removeAttribute('src');
            pageAudio.load();
            currentMusicPage = null;
        }

        function playPageMusic(category) {
            if (category === 'shouldnt' && !unlockedShouldnt) {
                stopPageMusic();
                return;
            }

            const music = getMusicData();
            const path = music[category];

            // Always stop the previous page's song before starting the next one.
            stopPageMusic();
            currentMusicPage = category;

            if (!path) return;

            pageAudio.src = path;
            pageAudio.load();
            pageAudio.play().catch(() => {
                const status = document.getElementById('music-status-' + category);
                if (status) {
                    status.textContent = currentLang === 'fa'
                        ? 'آهنگ پخش نشد. نام فایل و محل قرار گرفتن آن را بررسی کن؛ اگر پخش خودکار مسدود شد، یک بار روی صفحه بزن.'
                        : 'Could not play the song. Check the filename and file location; if autoplay is blocked, tap the page once.';
                }
            });
        }

        function detectMediaType(url) {
            const lower = url.toLowerCase();
            const embedPatterns = [
                /dood\.(stream|watch|to|so|ws|la|pm)/i,
                /d0000d\.com/i, /ds2play\.com/i, /mixdrop\./i,
                /mxdrop\./i, /streamtape\./i, /streamsb\./i,
                /filemoon\./i, /voe\.sx/i, /lulustream\./i,
                /\/e\//i, /\/embed\//i
            ];
            for (const pattern of embedPatterns) {
                if (pattern.test(lower)) return 'embed';
            }
            if (lower.match(/\.(mp4|webm|mov|avi|mkv)(\?|$)/i) || lower.includes('/api/file/')) return 'video';
            if (lower.match(/\.(jpg|jpeg|png|gif|webp|bmp)(\?|$)/i) || lower.includes('files.catbox.moe')) return 'image';
            return 'image';
        }

        function addItem(category) {
            const urlInput = document.getElementById('url-' + category);
            const titleInput = document.getElementById('title-' + category);
            const url = urlInput.value.trim();
            const title = titleInput.value.trim();

            if (!url) {
                alert(currentLang === 'fa' ? 'لینک را وارد کنید' : 'Please enter a link');
                return;
            }

            const data = getData();
            if (!Array.isArray(data[category])) data[category] = [];
            data[category].unshift({
                id: Date.now().toString() + Math.random().toString(16).slice(2),
                url: url, title: title, type: detectMediaType(url)
            });

            saveData(data);
            urlInput.value = '';
            titleInput.value = '';
            renderAll();
        }

        function deleteItem(category, id) {
            if (!confirm(currentLang === 'fa' ? 'مطمئنی می‌خوای پاکش کنی؟' : 'Delete this item?')) return;
            const data = getData();
            data[category] = (data[category] || []).filter(item => item.id !== id);
            saveData(data);
            renderAll();
        }

        function updateTitle(category, id, newTitle) {
            const data = getData();
            const item = (data[category] || []).find(i => i.id === id);
            if (item) {
                item.title = newTitle.trim();
                saveData(data);
            }
        }

        function createMediaTag(item) {
            const safeUrl = String(item.url || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const safeTitle = String(item.title || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            if (item.type === 'embed') {
                return '<iframe src="' + safeUrl + '" allowfullscreen allow="autoplay; fullscreen" loading="lazy" title="' + safeTitle + '"></iframe>';
            } else if (item.type === 'video') {
                return '<video src="' + safeUrl + '" controls playsinline preload="metadata"></video>';
            }
            return '<img src="' + safeUrl + '" alt="' + safeTitle + '" loading="lazy">';
        }

        function renderAll() {
            categories.forEach(cat => {
                const container = document.getElementById('grid-' + cat);
                const items = getData()[cat] || [];
                if (!container) return;

                if (items.length === 0) {
                    container.innerHTML = '<div class="empty-state">' +
                        (currentLang === 'fa' ? 'هنوز چیزی اضافه نشده' : 'Nothing here yet') +
                        '</div>';
                    return;
                }

                let html = '';
                items.forEach(item => {
                    const safeId = String(item.id).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
                    const safeCat = cat;
                    const title = String(item.title || (currentLang === 'fa' ? 'بدون عنوان' : 'Untitled'))
                        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    html += '<div class="item">' +
                        '<button class="delete-btn" onclick="deleteItem(\'' + safeCat + '\', \'' + safeId + '\')" aria-label="Delete item">×</button>' +
                        '<div class="media-placeholder">' + createMediaTag(item) + '</div>' +
                        '<div class="title-placeholder" contenteditable="' + isAdmin + '" onblur="updateTitle(\'' + safeCat + '\', \'' + safeId + '\', this.textContent)">' +
                        title + '</div></div>';
                });
                container.innerHTML = html;
            });
        }

        renderAll();
        refreshMusicStatuses();
    </script>
</body>
</html>
